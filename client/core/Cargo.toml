[package]
name = "tracker-core"
version = "0.1.0"
description = "Valheim tracker core: .fch reader, analysis, world reader and the Hall routes"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
flate2 = "1"
base64 = "0.22"
regex = "1"
tiny_http = "0.12"
