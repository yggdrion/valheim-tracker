[package]
name = "valheim-tracker-sync"
version = "0.1.0"
description = "Uploads changed Valheim character files (.fch) to a valheim-tracker server"
edition = "2021"

[lib]
name = "vts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
