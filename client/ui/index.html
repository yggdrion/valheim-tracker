<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valheim Tracker</title>
<style>
@font-face{font-family:'Cinzel';src:url(fonts/cinzel.woff2) format('woff2');font-weight:400 900}
@font-face{font-family:'Averia Serif Libre';src:url(fonts/averia-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Averia Serif Libre';src:url(fonts/averia-400i.woff2) format('woff2');font-weight:400;font-style:italic}
@font-face{font-family:'Averia Serif Libre';src:url(fonts/averia-700.woff2) format('woff2');font-weight:700}
:root{--head:'Cinzel',Georgia,serif;--body:'Averia Serif Libre',Georgia,serif;--ink:#0d0f12;--wood:#2a1f17;--wood2:#3a2b1f;--line:#4a3a2a;
 --gold:#d4a84f;--gold2:#f0cf86;--parch:#e9dfc8;--mut:#a39a85;--ember:#e0813a;--ok:#8fbf6a;--bad:#e05a3a;--frost:#7fc4e0}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;color:var(--parch);font:14px/1.45 var(--body);min-height:100vh;user-select:none;
 background:radial-gradient(700px 300px at 50% -100px,#2d3b45 0%,transparent 70%),var(--ink)}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
.tb{flex:none;height:34px;display:flex;align-items:center;background:rgba(0,0,0,.4);border-bottom:1px solid var(--line)}
.tb .ttl{flex:1;height:100%;display:flex;align-items:center;padding-left:14px;font-family:var(--head);font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);pointer-events:auto}
.tb button{width:46px;height:34px;border:0;border-radius:0;background:transparent;color:var(--parch);padding:0;display:grid;place-items:center}
.tb button:hover{background:rgba(255,255,255,.09)}
.tb button.x:hover{background:#c42b1c;color:#fff}
.tb .tab,.tb .seg button{width:auto;height:100%;padding:0 12px;font-family:var(--head);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid transparent}
.tb .updb{display:none;width:auto;height:24px;margin-right:8px;padding:0 12px;border:1px solid var(--gold);border-radius:12px;align-items:center;gap:7px;font-family:var(--head);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--gold)}
.tb .updb.on{display:flex}.tb .updb:hover{background:var(--gold2)}.tb .updb:disabled{opacity:.7}
.tb .updb i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.tb .tab.on{color:var(--gold2);border-bottom-color:var(--gold)}
.tb .seg{display:none;height:100%;margin-right:6px}.tb .seg.on{display:flex}
.tb .seg button{padding:0 9px;font-size:10px}.tb .seg button.on{color:var(--gold2);border-bottom-color:var(--gold)}
#hallv{flex:1;min-height:0;display:none}#hallv iframe{width:100%;height:100%;border:0;display:block;background:var(--ink)}
body.vh #hallv{display:block}body.vh main{display:none}
#worldp select{width:100%;font:inherit;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:7px;color:var(--parch);padding:6px 9px}
#worldp{order:3}
.tb svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.1;pointer-events:none}
main{flex:1;min-height:0;overflow:auto;padding:12px 14px 12px;display:flex;flex-direction:column;gap:12px}
header{text-align:center}
.rune{color:var(--gold);letter-spacing:.35em;font-size:10px;opacity:.7}
h1{margin:0;font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.panel{background:linear-gradient(180deg,var(--wood2),var(--wood));border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
h2{margin:0 0 8px;font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
label.f{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}
input[type=text],input[type=password],input[type=url]{width:100%;font:inherit;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:7px;color:var(--parch);padding:6px 9px;user-select:text}
input:focus{outline:none;border-color:var(--gold)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
button{font:inherit;font-size:13px;color:var(--parch);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--gold)}
button.main{background:var(--gold);color:#1a1208;border-color:var(--gold)}
button.main:hover{background:var(--gold2)}
.msg{font-size:12.5px;margin-top:8px;color:var(--mut);font-style:italic;min-height:1em}
.msg.good{color:var(--ok)}.msg.bad{color:var(--bad)}
.path{font-size:12.5px;color:var(--parch);word-break:break-all;background:rgba(0,0,0,.25);border-radius:6px;padding:5px 8px;user-select:text}
.small{font-size:12px;color:var(--mut)}
.cands{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.cands button{text-align:left;white-space:normal;word-break:break-all;font-size:12px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
li:last-child{border:0}
li .nm{font-family:var(--head);font-weight:700;font-size:14px;letter-spacing:.04em}
li .st{font-size:12px;color:var(--mut)}
li .st b{font-weight:normal}
li.off .nm{color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--mut);vertical-align:middle}
.s-uploaded .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}.s-idle .dot{background:var(--frost)}
.s-rejected .dot,.s-error .dot{background:var(--bad)}.s-unreachable .dot{background:var(--ember)}.s-paused .dot,.s-off .dot{background:#5a5348}
input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}
.empty{color:var(--mut);font-style:italic;padding:8px 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut);cursor:pointer}
.err{color:var(--bad)}
#warriors{display:flex;flex-direction:column;min-height:0}
#chars{overflow-y:auto;min-height:0;flex:1;margin-right:-8px;padding-right:8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#chars::-webkit-scrollbar{width:7px}#chars::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}#chars::-webkit-scrollbar-thumb:hover{background:var(--gold)}
.link{border:0;background:none;padding:0;font-size:12px;color:var(--mut);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--gold2);border:0}.link:disabled{opacity:.6;text-decoration:none;cursor:default}
li{cursor:default}
#upd{display:none;align-items:center;gap:10px;justify-content:center;border-color:var(--gold)}
#upd.on{display:flex}
#warriors{order:1}#hallp{order:2}#dirp{order:3}.foot{order:4}header{order:0}
body.setup #hallp{order:1}body.setup #dirp{order:2}body.setup #warriors{order:3}
@media(max-width:879px){#chars{max-height:46vh}}
@media(min-width:880px){
 main{display:grid;grid-template-columns:minmax(330px,400px) 1fr;grid-template-rows:auto auto auto auto 1fr auto;align-items:start;width:100%;max-width:1200px;margin:0 auto}
 header{grid-column:1/-1}
 #hallp,body.setup #hallp{grid-column:1;grid-row:2}
 #dirp,body.setup #dirp{grid-column:1;grid-row:3}
 #worldp{grid-column:1;grid-row:4}
 #warriors,body.setup #warriors{grid-column:2;grid-row:2/6;align-self:stretch}
 .foot{grid-column:1/-1;grid-row:6}
 #upd{grid-column:1/-1}
}
</style></head>
<body>
<div class="tb" data-tauri-drag-region>
  <div class="ttl" data-tauri-drag-region>Valheim Tracker</div>
  <button class="updb" id="updtb" title="Install the new version and restart"><i></i><span>Update</span></button>
  <button class="tab" id="tabhall">Hall</button>
  <button class="tab" id="tabset">Settings</button>
  <div class="seg" id="seg"><button id="vlocal">Local</button><button id="vgroup">Group</button></div>
  <button id="wmin" title="minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
  <button id="wmax" title="maximize"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
  <button id="wclose" class="x" title="close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
</div>
<div id="hallv"><iframe id="hall" title="The Hall" sandbox="allow-scripts allow-same-origin"></iframe></div>
<main>
<header><div class="rune">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div><h1>Valheim Tracker</h1></header>

<section class="panel" id="upd"><span id="updmsg"></span><button class="main" id="updgo">Update &amp; restart</button></section>

<section class="panel" id="hallp">
  <h2>The Hall</h2>
  <label class="f" for="server">Server address</label>
  <input type="url" id="server" placeholder="http://your-server:8088" spellcheck="false">
  <label class="f" for="token">Token</label>
  <div class="row"><input type="password" id="token" placeholder="the shared token" spellcheck="false"><button id="show" title="show or hide the token">show</button></div>
  <div class="row" style="margin-top:10px"><button class="main" id="save">Save &amp; connect</button><button id="test">Test</button><span class="sp" style="flex:1"></span><button id="openhall">Open the Hall</button></div>
  <div class="msg" id="smsg"></div>
</section>

<section class="panel" id="dirp">
  <h2>Characters folder</h2>
  <div class="path" id="dir"></div>
  <div class="small" id="dirnote"></div>
  <div class="row" style="margin-top:8px"><button id="pick">Choose folder…</button><button id="auto">Detect automatically</button></div>
  <div class="cands" id="cands"></div>
</section>

<section class="panel" id="warriors">
  <h2>Warriors <span class="sp"></span><label class="chk"><input type="checkbox" id="paused"> pause</label><button id="now">Sync now</button></h2>
  <ul id="chars"></ul>
</section>

<section class="panel" id="worldp" hidden>
  <h2>World</h2>
  <select id="world" aria-label="World"></select>
  <div class="small" id="worldnote"></div>
</section>

<div class="foot">
  <label class="chk"><input type="checkbox" id="autostart"> Start with my computer</label>
  <span class="small">read-only on your game files · <span id="ver"></span> · <button class="link" id="updchk">Check for updates</button></span>
</div>
</main>
<script>
const T=window.__TAURI__,call=(c,a)=>T.core.invoke(c,a),$=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ago=t=>{if(!t)return'';const s=Date.now()/1000-t;return s<60?'just now':s<5400?Math.round(s/60)+' min ago':s<172800?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'};
const LABEL={idle:'waiting for a change',uploaded:'uploaded',rejected:'rejected by the server',unreachable:'server unreachable, retrying',error:'error',paused:'paused',off:'not synced'};
let S=null,edited=false,userTab=false,autoTab=false,lastView=null;
const reloadHall=()=>{$('hall').src=S.hall_url};
function setTab(settings){document.body.classList.toggle('vh',!settings);
  $('tabhall').classList.toggle('on',!settings);$('tabset').classList.toggle('on',settings)}
$('tabhall').onclick=()=>{userTab=true;setTab(false)};$('tabset').onclick=()=>{userTab=true;setTab(true)};
const setView=v=>S&&S.view!==v&&call('set_view',{view:v}).then(show).catch(e=>{$('smsg').textContent=String(e)});
$('vlocal').onclick=()=>setView('local');$('vgroup').onclick=()=>setView('group');
$('world').onchange=e=>call('set_world',{name:e.target.value}).then(s=>{show(s);reloadHall()}).catch(x=>{$('worldnote').textContent=String(x)});
function renderWorld(s){const p=$('worldp'),sel=$('world'),k=s.worlds.join('\n')+'|'+s.world;
  p.hidden=false;
  if(sel.dataset.k!==k){sel.dataset.k=k;sel.replaceChildren();
    if(!s.worlds.length){sel.hidden=true;$('worldnote').textContent='No 1.0 world found next to the characters folder.';return}
    sel.hidden=false;$('worldnote').textContent='';
    const o=el('option','','newest');o.value='';sel.append(o);
    for(const w of s.worlds){const x=el('option','',w);x.value=w;sel.append(x)}
    sel.value=s.world}}

function show(s){S=s;
  // whatever changed the view (the switch, saving or clearing the server), the frame must not mix the two
  if(s.view!==lastView){lastView=s.view;reloadHall()}
  // Settings until a folder is known, then the Hall once (the first status can come before the first tick)
  if(!userTab&&!autoTab){if(s.dir){autoTab=true;setTab(false)}else setTab(true)}
  $('seg').classList.toggle('on',!!s.settings.server);$('vlocal').classList.toggle('on',s.view==='local');$('vgroup').classList.toggle('on',s.view==='group');
  renderWorld(s);
document.body.classList.toggle('setup',!s.server.startsWith('Connected')||!s.dir);
  if(!edited){$('server').value=s.settings.server;$('token').value=s.settings.token}
  const m=$('smsg');m.textContent=s.server;m.className='msg'+(s.server.startsWith('Connected')?' good':s.server&&!s.server.startsWith('Enter')?' bad':'');
  $('openhall').disabled=!s.settings.server;
  $('dir').textContent=s.dir||'No characters folder found.';$('dir').classList.toggle('err',!s.dir);
  $('dirnote').textContent=s.dir_auto?(s.dir?'detected automatically':'Valheim saves not found in the usual places: choose the folder.'):'chosen by you';
  const c=$('cands'),ck=s.dir+'|'+s.dir_auto+'|'+s.candidates.join();if(c.dataset.k!==ck){c.dataset.k=ck;c.replaceChildren();
  if(s.dir_auto&&s.candidates.length>1){c.append(el('div','small','Other folders with characters:'));
    for(const p of s.candidates)if(p!==s.dir){const b=el('button','',p);b.onclick=()=>call('set_dir',{dir:p}).then(show);c.append(b)}}}
  $('paused').checked=s.settings.paused;
  renderChars(s)}
const rows=new Map();
function renderChars(s){const ul=$('chars');
  if(!s.chars.length){rows.clear();ul.replaceChildren(el('li','empty',s.dir?'No characters in this folder yet.':'Choose the characters folder above.'));return}
  ul.querySelector('.empty')?.remove();
  const seen=new Set();let prev=null;
  for(const ch of s.chars){seen.add(ch.name);let r=rows.get(ch.name);
    if(!r){const li=el('li'),cb=el('input'),mid=el('div'),nm=el('div','nm',ch.name),st=el('div','st'),dot=el('span','dot'),lab=el('b'),msg=document.createTextNode(''),right=el('div','st');
      cb.type='checkbox';cb.title='sync this character';
      cb.onchange=()=>{li.classList.toggle('off',!cb.checked);pending++;call('set_selected',{name:ch.name,on:cb.checked}).then(show).finally(()=>pending--)};
      st.append(dot,lab,msg);mid.append(nm,st);li.append(cb,mid,right);
      r={li,cb,lab,msg,right};rows.set(ch.name,r)}
    r.li.className=(ch.selected?'':'off ')+'s-'+ch.status;
    if(document.activeElement!==r.cb)r.cb.checked=ch.selected;
    r.lab.textContent=ch.status==='rejected'&&!(s.settings.server&&s.settings.token)?'rejected':LABEL[ch.status]||ch.status;r.msg.nodeValue=ch.message?': '+ch.message:'';
    r.right.textContent=ch.last_upload?'last upload '+ago(ch.last_upload):ch.modified?'saved '+ago(ch.modified):'';
    const want=prev?prev.nextSibling:ul.firstChild;
    if(want!==r.li)ul.insertBefore(r.li,want);
    prev=r.li}
  for(const[n,r]of rows)if(!seen.has(n)){r.li.remove();rows.delete(n)}}
let pending=0;
$('server').oninput=$('token').oninput=()=>{edited=true};
$('show').onclick=()=>{const t=$('token');t.type=t.type==='password'?'text':'password';$('show').textContent=t.type==='password'?'show':'hide'};
$('save').onclick=async()=>{$('smsg').textContent='connecting…';$('smsg').className='msg';
  show(await call('save_server',{server:$('server').value,token:$('token').value}));edited=false};
$('test').onclick=async()=>{$('smsg').textContent='testing…';$('smsg').className='msg';show(await call('test_server'))};
$('openhall').onclick=()=>call('open_hall').catch(e=>{$('smsg').textContent=String(e)});
$('pick').onclick=async()=>show(await call('pick_dir'));
$('auto').onclick=async()=>show(await call('set_dir',{dir:''}));
$('paused').onchange=async e=>show(await call('set_paused',{paused:e.target.checked}));
$('now').onclick=()=>call('sync_now');
$('autostart').onchange=async e=>{try{e.target.checked=await call('set_autostart',{on:e.target.checked})}catch(x){e.target.checked=!e.target.checked;$('smsg').textContent='autostart: '+x}};
for(const id of ['server','token'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('save').click()});
async function checkUpdate(manual){const b=$('updchk');if(manual){b.disabled=true;b.textContent='checking…'}
  try{const u=await call('check_update');
    if(u.available){$('updmsg').textContent='Version '+u.available+' is available.';$('upd').classList.add('on');
      $('updtb').classList.add('on');$('updtb').lastChild.textContent='Update to '+u.available}
    else if(manual)b.textContent='up to date'}
  catch(e){if(manual)b.textContent='check failed';console.warn('update check',e)}
  if(manual)setTimeout(()=>{b.disabled=false;b.textContent='Check for updates'},3000)}
$('updchk').onclick=()=>checkUpdate(true);
async function installUpdate(){const b=$('updgo'),t=$('updtb'),l=t.lastChild,was=l.textContent;b.disabled=t.disabled=true;b.textContent=l.textContent='updating…';
  try{await call('install_update')}catch(e){b.disabled=t.disabled=false;b.textContent='Update & restart';l.textContent=was;$('updmsg').textContent='Update failed: '+e;t.title='Update failed: '+e}}
$('updgo').onclick=$('updtb').onclick=installUpdate;
const W=T.window.getCurrentWindow();
$('wmin').onclick=()=>W.minimize();$('wmax').onclick=()=>W.toggleMaximize();$('wclose').onclick=()=>W.close();
T.app.getVersion().then(v=>$('ver').textContent='v'+v);
checkUpdate(false);setInterval(()=>checkUpdate(false),3600*1000);
T.event.listen('status',e=>{if(!pending)show(e.payload)});
call('get_status').then(show);call('get_autostart').then(v=>$('autostart').checked=v);
</script>
</body></html>
