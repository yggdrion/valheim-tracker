<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Valheim Achievement Hall</title>
<style>
@font-face{font-family:'Cinzel';src:url(/fonts/cinzel.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'Averia Serif Libre';src:url(/fonts/averia-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Averia Serif Libre';src:url(/fonts/averia-400i.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Averia Serif Libre';src:url(/fonts/averia-700.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--head:'Cinzel',Georgia,serif;--body:'Averia Serif Libre',Georgia,serif;
  --ink:#0d0f12;--wood:#2a1f17;--wood2:#3a2b1f;--line:#4a3a2a;
  --gold:#d4a84f;--gold2:#f0cf86;--parch:#e9dfc8;--mut:#a39a85;--ember:#e0813a;--frost:#7fc4e0;--ok:#8fbf6a;
  --s-unlocked:#d4a84f;--s-byplayers:#5fc2b0;--s-partial:#e0813a;--s-locked:#6b6558;--s-unknown:#3d3a35;
  --c0:#d4a84f;--c1:#5fc2b0;--c2:#e0813a;--c3:#7fa8e8;--c4:#9bc45e;--c5:#c487d8;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;color:var(--parch);font:15px/1.5 var(--body);min-height:100vh;
  background:radial-gradient(1200px 500px at 50% -120px,#2d3b45 0%,transparent 70%),
   radial-gradient(800px 400px at 90% 100%,#2b1a10 0%,transparent 70%),
   repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),var(--ink)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.rune{color:var(--gold);letter-spacing:.35em;font-size:13px;opacity:.8}
header{text-align:center;padding:14px 0 6px}
h1{margin:6px 0 0;font-family:var(--head);font-weight:700;font-size:clamp(26px,5vw,40px);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);text-shadow:0 2px 0 #000,0 0 22px rgba(212,168,79,.28)}
.sub{color:var(--mut);font-size:13px;font-style:italic}
.divider{height:14px;margin:12px auto 18px;max-width:520px;background:linear-gradient(90deg,transparent,var(--gold) 50%,transparent) center/100% 1px no-repeat;position:relative}
.divider:after{content:'ᛟ';position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--ink);padding:0 10px;color:var(--gold)}
.panel{background:linear-gradient(180deg,var(--wood2),var(--wood));border:1px solid var(--line);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.45);padding:14px 16px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
button{font:inherit;color:var(--parch);cursor:pointer}

/* world */
.world{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:16px}
@media(max-width:760px){.world{grid-template-columns:1fr}}
.wname{font-family:var(--head);font-weight:700;font-size:26px;color:var(--gold2)}.wmeta{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:2px 9px;border:1px solid var(--line);border-radius:99px;background:rgba(0,0,0,.25)}
.bosses{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.boss{text-align:center;padding:10px 4px 8px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.28);filter:grayscale(1);opacity:.5}
.boss.dead{filter:none;opacity:1;border-color:var(--gold);box-shadow:0 0 14px rgba(212,168,79,.22)}
.boss b{display:block;font-size:22px;color:var(--gold)}.boss span{font-family:var(--head);font-weight:500;font-size:12px;letter-spacing:.06em}
.boss em{display:block;font-size:10px;color:var(--mut);font-style:normal;text-transform:uppercase;letter-spacing:.14em}

/* players: stacked */
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who button{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;gap:8px;align-items:center}
.who button i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35}
.who button.on{border-color:var(--c);background:rgba(255,255,255,.07)}.who button.on i{opacity:1;box-shadow:0 0 8px var(--c)}
.who small{color:var(--mut);margin-left:auto;font-style:italic}
.prow{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.prow:last-child{border:0}.prow .nm{color:var(--c);font-family:var(--head);font-weight:700;font-size:16px}.prow .n{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.prow .n b{color:var(--parch);font-size:16px}
@media(max-width:560px){.prow{grid-template-columns:90px 1fr}.prow .n{grid-column:1/-1;text-align:left}}
.bar{height:9px;border-radius:5px;background:#0a0b0d;box-shadow:inset 0 1px 3px #000;overflow:hidden;border:1px solid #2b2218}
.bar i{display:block;height:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--gold)) 85%,#fff),var(--c,var(--gold)));border-radius:4px}
.bar.thin{height:6px}

/* toolbar */
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:rgba(0,0,0,.3);border:0;padding:5px 12px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border:0}.seg button.on{background:var(--gold);color:#1a1208}
.fl{display:flex;flex-wrap:wrap;gap:6px}
.fl button{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.fl button i{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.fl button.on{border-color:var(--sc);background:rgba(255,255,255,.08)}.fl button b{color:var(--mut);font-weight:normal}
input[type=search]{font:inherit;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;color:var(--parch);padding:5px 10px;min-width:170px}

/* road: what's left per biome */
.road .bar2{margin-bottom:10px}
.seg.bios{flex-wrap:wrap}.seg.bios button small{opacity:.7;margin-left:5px;font-size:11px}
.rsec{margin:12px 0 4px;display:flex;align-items:baseline;gap:10px;font-family:var(--head);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.rsec small{font-family:var(--body);letter-spacing:0;text-transform:none;color:var(--mut);font-size:12px}
.rt{display:inline-flex;gap:7px;align-items:center;font-size:13px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.22)}
.rt .pd{display:inline-flex;gap:3px}.rt .pdot{width:9px;height:9px}
.rt.all{border-color:var(--gold);color:var(--gold2);background:rgba(212,168,79,.08)}
.rt.none{border-style:dashed;color:#9b927c}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut);cursor:pointer}
.who button .wd{font-size:11px;color:var(--mut);font-style:italic}
.who button.away{opacity:.55}

.cath{display:flex;align-items:baseline;gap:10px;margin:18px 0 5px;font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
.cath:first-child{margin-top:4px}.cath small{font-family:var(--body);font-weight:normal;letter-spacing:0;text-transform:none;color:var(--mut);font-size:12.5px}
.catb{margin-top:10px}
a.nm{text-decoration:none}a.nm:hover{text-decoration:underline}
.back{color:var(--gold);text-decoration:none;font-size:14px}.back:hover{text-decoration:underline}
.ph{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:end;margin:6px 0 12px}
.pname{font-family:var(--head);font-weight:700;font-size:30px;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.ph .wmeta{grid-column:1}.pbig{grid-column:2;grid-row:1/3;color:var(--mut);font-size:14px;text-align:right}.pbig b{display:block;font-size:34px;color:var(--parch);line-height:1}
.pcats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 22px}
.pcat{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px}.pcat small{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}

.fel .ft{margin-bottom:6px;color:var(--mut);font-size:13px}.fel .ft b{color:var(--parch);font-size:20px;margin-right:2px}
.fel .bar i{background:linear-gradient(180deg,var(--gold2),var(--gold))}
.pages{margin-top:8px;font-size:13px;color:var(--mut)}.pages a{color:var(--c);text-decoration:none;font-family:var(--head);font-weight:700}.pages a:hover{text-decoration:underline}.pages small{font-style:italic}
.saga .sub2{color:var(--mut);font-size:13px;font-style:italic;margin:-4px 0 12px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.theme{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.theme h3{margin:0 0 8px;font-family:var(--head);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);padding:1px 0}
.kv b{color:var(--parch);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv.big b{font-size:22px;color:var(--gold2);line-height:1.1}.kv.big{align-items:baseline;margin-bottom:4px}
.top{margin-top:8px;border-top:1px solid rgba(255,255,255,.07);padding-top:6px}
.top .kv{font-size:12.5px}.top .kv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
@media(max-width:560px){.themes{grid-template-columns:1fr 1fr;gap:8px}.theme{padding:8px 9px}.kv{font-size:12px}.kv.big b{font-size:18px}
 .top .kv{font-size:11.5px}.panel{padding:12px}.seg.bios button{padding:5px 8px;font-size:12px}.who button{padding:5px 9px}
 .ph{grid-template-columns:1fr}.pbig{grid-column:1;grid-row:auto;text-align:left}.pcat{grid-template-columns:110px 1fr 40px}}
.warn{background:#3a1d14;border:1px solid var(--ember);color:#f3c7a8;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.who button.rest i{opacity:.2;box-shadow:none}.who button.rest.on i{opacity:.6}
.empty b{color:var(--gold2);font-style:normal;font-family:var(--head);letter-spacing:.06em}
/* achievement states */
.st-unlocked{--sc:var(--s-unlocked)}.st-byplayers{--sc:var(--s-byplayers)}.st-partial{--sc:var(--s-partial)}.st-locked{--sc:var(--s-locked)}.st-unknown{--sc:var(--s-unknown)}
.ic{width:100%;aspect-ratio:1;border-radius:8px;display:block;background:#0a0b0d;object-fit:cover}
.lock .ic,.st-locked .ic{filter:grayscale(1) brightness(.75)}
.st-unknown .ic{filter:grayscale(1) brightness(.5)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.card{background:rgba(0,0,0,.28);border:1.5px solid var(--sc);border-radius:10px;padding:10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.st-unlocked.card{box-shadow:0 0 16px rgba(212,168,79,.28);background:rgba(212,168,79,.08)}
.st-unknown.card{border-style:dashed;opacity:.7}
.card:hover{background:rgba(255,255,255,.07)}
.card .ic{width:64px;margin:0 auto}
.card .t{font-size:13.5px;line-height:1.25;min-height:34px;display:flex;align-items:center;justify-content:center}
.card .s{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sc)}
.card .pd{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.pdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--c);background:transparent;position:relative;overflow:hidden}
.pdot.y{background:var(--c);box-shadow:0 0 6px var(--c)}
.pdot.h:after{content:'';position:absolute;inset:0 50% 0 0;background:var(--c)}
.pdot.u{border-style:dotted;opacity:.4}

/* list */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px minmax(180px,1.1fr) 1.4fr;gap:14px;align-items:center;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;border-left:3px solid var(--sc);padding-left:10px}
.row:hover{background:rgba(255,255,255,.04)}
.row .ic{width:52px}
.row .nm{font-size:16px}.row .ds{color:var(--mut);font-size:13px;font-style:italic}
.row .tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sc)}
.pl{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:12.5px;margin:2px 0}
.pl span:first-child{color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl span:last-child{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:700px){.row{grid-template-columns:44px 1fr}.row .pls{grid-column:1/-1}}

/* matrix */
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:480px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
th{font-family:var(--head);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--gold))}
td.a{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:230px;border-left:3px solid var(--sc)}
td.a .ic{width:32px}.td-c{text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut)}
.td-c.y{color:var(--c);font-size:16px}.td-c.p{color:var(--c)}

/* dialog */
dialog{background:linear-gradient(180deg,var(--wood2),var(--wood));color:var(--parch);border:1px solid var(--gold);border-radius:12px;padding:0;max-width:760px;width:calc(100% - 24px);box-shadow:0 20px 60px #000}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dh{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh .ic{width:72px;flex:none}.dh h3{margin:0;font-family:var(--head);font-size:22px;font-weight:700;color:var(--gold2)}.dh p{margin:2px 0 0;color:var(--mut);font-style:italic;font-size:14px}
.dh .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;align-self:flex-start}
.db{padding:14px 18px 18px;max-height:65vh;overflow:auto}
.pb{margin-bottom:16px}.pb h4{margin:0 0 4px;font-weight:normal;color:var(--c);font-size:16px;display:flex;justify-content:space-between}
.pb h4 small{color:var(--mut);font-size:13px}
.bio{margin:10px 0 3px;font-family:var(--head);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.bio{display:flex;justify-content:space-between}.bio small{letter-spacing:0;color:var(--mut)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.tile{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:3px 10px 3px 7px;border-radius:7px;border:1px dashed #5a4a38;color:#8c846f;background:rgba(0,0,0,.2)}
.tile b{font-weight:normal;opacity:.6}.tile small{opacity:.7}
.tile.y{border:1px solid var(--c);color:var(--parch);background:color-mix(in srgb,var(--c) 18%,transparent)}
.tile.y b{color:var(--c);opacity:1}
.note{color:var(--mut);font-size:12.5px;font-style:italic;margin-top:8px}
.empty{color:var(--mut);font-style:italic;padding:20px;text-align:center}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:24px}
</style></head><body><main>
<header><div class="rune">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div><h1>Achievement Hall</h1><div class="sub">the fellowship's road to all 53</div></header>
<div class="divider"></div>

<div class="warn" id="warn" hidden></div>
<section class="panel saga" id="sagap" hidden><h2 id="sagah">Saga of the Fellowship</h2><div class="sub2" id="sagas"></div><div class="themes" id="saga"></div></section>
<section class="panel" id="worldp" hidden><div class="world" id="world"></div></section>
<section class="panel"><h2 id="wh">The Fellowship</h2><div class="who" id="who"></div><div id="prog" style="margin-top:10px"></div></section>

<section class="panel road" id="roadp"><h2>The Road</h2>
  <div class="bar2"><div class="seg bios" id="bios"></div><label class="chk"><input type="checkbox" id="hideall"> hide what's done</label></div>
  <div id="road"></div>
</section>

<section class="panel" id="achp">
  <h2>Achievements</h2>
  <div class="bar2">
    <div class="seg" id="views"><button data-v="cards">Cards</button><button data-v="list">List</button><button data-v="matrix">Matrix</button></div>
    <input type="search" id="q" placeholder="search…">
  </div>
  <div class="fl" id="flt" style="margin-bottom:14px"></div>
  <div id="view"></div>
</section>
<footer id="foot"></footer>
</main>
<dialog id="dlg"></dialog>
<script>
const ICON='https://shared.akamai.steamstatic.com/community_assets/images/apps/892970/';
const COL=['--c0','--c1','--c2','--c3','--c4','--c5'];
const RUNES=['ᛏ','ᚦ','ᛒ','ᛞ','ᛃ','ᛉ','ᚨ','ᛟ'];
const BIO=['Meadows','Black Forest','Ocean','Swamp','Mountain','Plains','Mistlands','Ashlands','Deep North'];
const STATES=[['unlocked','Unlocked'],['byplayers','Some have it'],['partial','In progress'],['locked','Locked'],['unknown','Not trackable']];
const SECTION_OF={AllItemCraft:'crafted',AllWeaponCraft:'weapons',AllFoodCooked:'cooked',AllFoodEaten:'food-eaten',AllBuildPieces:'built',
 DeathByAllTypes:'deaths',DeathByTreeAll:'tree-deaths',KillAllCreatures:'enemies',KillAllCreaturesHard:'enemies-hard',AllBosses:'bosses-any',
 AllBossesNormal:'bosses-normal',AllBossesHard:'bosses-hard',AllMiniBosses:'minibosses',GrindFish:'fishing',FindAllTrophies:'trophies'};

const CATS=[
 ['Bosses',['Boss1Eikthyr','Boss2Elder','Boss3Bonemass','Boss4Moder','Boss5Yagluth','Boss6Queen','Boss7Fader','Boss8FrozenKing','AllBosses','AllBossesNormal','AllBossesHard','AllMiniBosses','MultiplayerBoss','SoloBoss']],
 ['Hunting',['KillAllCreatures','KillAllCreaturesHard','FindAllTrophies','GrindLeviathan']],
 ['Crafting',['AllItemCraft','AllWeaponCraft','BuildDyrnwyn']],
 ['Building',['AllBuildPieces','GrindBuild','BuildHouse','BuildVillage','BuildHigh','BuildHighWorld','GrindComfort']],
 ['Food & gathering',['AllFoodCooked','AllFoodEaten','GrindCook','GrindEat','GrindHarvest','GrindForager','GrindHoney','GrindTrees']],
 ['Exploration & sea',['Arrived','ExploreNSEW','ExploreNSEWNoMap','SailEdge','GrindSail','GrindSailHelm','GrindTreasure','GrindFish','BigFish']],
 ['Deaths',['FirstDeath','DeathByAllTypes','DeathByTree','DeathByTreeAll','DeathByObliterator']],
 ['Legacy',['GrindDays','KingsQueens','ChildOfOdin']]];
const catOf=api=>(CATS.find(c=>c[1].includes(api))||['Other'])[0];
let route=null;
let WNAME='',ACH=[],chars=[],sel=new Set(),first=true,full={},stale=10,lost='';
let view=ls('view')||'cards',flt=new Set(JSON.parse(ls('flt')||'[]')),q='',open=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem('vh_'+k);localStorage.setItem('vh_'+k,v)}catch(e){}}
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const idx=n=>chars.findIndex(c=>c.name===n);
const colv=n=>`var(${COL[idx(n)%COL.length]})`;
const tint=(e,n)=>{e.style.setProperty('--c',colv(n));return e};
const ago=t=>{const s=Date.now()/1000-t;return s<90?'just now':s<5400?Math.round(s/60)+' min ago':s<172800?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'};
const shown=()=>route?chars.filter(c=>c.name===route&&full[c.name]):chars.filter(c=>sel.has(c.name)&&full[c.name]);
const icon=(a,got)=>{const i=el('img','ic');i.loading='lazy';i.alt=a.name;i.src=ICON+(got?a.icon_achieved:a.icon_unachieved);i.onerror=()=>{i.style.visibility='hidden'};return i};

function prog(n,a){const p=full[n].achievements[a.api_name];return p?{d:p[0],t:p[1],f:p[1]?p[0]/p[1]:0,done:p[0]>=p[1]&&p[1]>0}:null}
function stateOf(a,P){
  const ps=P.map(c=>prog(c.name,a)),tr=ps.filter(Boolean);
  if(!tr.length)return{s:'unknown',ps,best:0,nDone:0};

function renderRoad(P){

  if(!P.length){r.append(el('div','empty','Pick at least one warrior.'));return}
  // per biome: entries of every section, done-flags per player
  const secs=P.map(c=>{const S=Object.fromEntries(full[c.name].sections.map(x=>[x.id,x]));
    // one Slay row from the three boss lists: done = slain on hard; any/normal count as partial
    const A=S['bosses-any'],N=S['bosses-normal'],H=S['bosses-hard'];
    if(A&&N&&H)S.slay={entries:A.entries.map((e,k)=>{const h=H.entries[k].count>0,n=N.entries[k].count>0,a=e.count>0;
      return{...e,lv:h?1:n?2/3:a?1/3:0,how:h?'slain on hard':n?'slain on normal, not yet on hard':a?'slain, not yet on normal or hard':'not slain yet'}})};
    return S});
  const lv=(S,sid,k)=>{const e=S[sid].entries[k];return e.lv??(e.count>0?1:0)};

    const es=(secs[0][sid]?.entries||[]).map((e,k)=>({e,k})).filter(x=>bioOf(x.e)===bio);if(!es.length)continue;

          full1=x=>x.got.every(v=>v>=1),nAll=rows.filter(full1).length,show=rows.filter(x=>!hideAll||!full1(x));

    for(const {e,got,how} of show){const n=sum({got}),t=el('span','rt'+(n>=P.length?' all':n?'':' none'));t.append(e.name);
      const tip=(c,i)=>c.name+': '+(how[i]||(got[i]?'done':'missing'));

      t.title=P.map(tip).join('\n');m.append(t)}
    r.append(m);if(sid==='slay')r.append(el('div','note','full dot: slain on hard · half: slain on an easier difficulty'))}
  if(!any)r.append(el('div','empty',`Nothing left in ${bio}: everyone has it all.`));

function renderSaga(P){
